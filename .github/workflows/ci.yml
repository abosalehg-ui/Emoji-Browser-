name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run validate:data
      - run: npm test
      # Runtime dependencies are the ones that reach users, so a finding there
      # fails the build; dev-only advisories are reported without blocking.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Audit dev dependencies (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
