name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish only the files the app actually serves. Uploading the
      # repository root also shipped package.json, the test suite, and the
      # tooling configs to the public site.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html offline.html manifest.webmanifest sw.js LICENSE _site/
          cp -r styles scripts data assets _site/
          rm -rf _site/scripts/tools
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
